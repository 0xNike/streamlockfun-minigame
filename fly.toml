# Fly.io configuration for the streamlockfun-minigame operator server.
#
# Single-machine, always-on, single region. The match registry is in-memory
# and settlement timers run inside the process — DO NOT scale horizontally
# without first moving state to Redis/Postgres. DO NOT enable
# auto_stop_machines without also moving the dispute-window timer off-process.

app = "streamlockfun-minigame"
primary_region = "iad"

[build]

# Non-secret config. Secrets (RPC URL, operator keys, World ID) go via
# `fly secrets set` and are exposed at runtime as additional env vars.
[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  DATABASE_PATH = "/data/operator.sqlite"
  PUBLIC_BASE_URL = "https://streamlockfun-minigame.fly.dev"
  PUBLIC_WS_URL = "wss://streamlockfun-minigame.fly.dev"
  TOKEN_ENV = "sol"
  LOG_LEVEL = "info"
  COHORT_MAX_RATIO = "5"
  DISPUTE_WINDOW_SEC = "30"
  FINALIZE_BUFFER_SEC = "10"
  WORLD_ACTION = "play-rps"
  WORLD_ENVIRONMENT = "staging"

# Persistent volume for SQLite. Without this, every redeploy wipes match history.
[[mounts]]
  source = "operator_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Always-on. min_machines_running + auto_start_machines together mean Fly
  # will resurrect the machine if it crashes or hits the restart cap, instead
  # of leaving it stopped. auto_stop = "off" prevents idle suspend.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
